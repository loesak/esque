[project]
name = "esque-compatibility-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.3.0",
    "testcontainers[elasticsearch]>=4.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "ty>=0.0.0a6",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
