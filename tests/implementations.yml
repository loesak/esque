implementations:
  jvm:
    invocation: gradle
    gradle_dir: "implementations/jvm"
    task: "run"
  python:
    invocation: direct
    command: ["uv", "run", "--project", "implementations/python", "esque"]
  typescript:
    invocation: direct
    command: ["npm", "exec", "--prefix", "implementations/typescript", "--", "tsx", "implementations/typescript/src/cli.ts"]
