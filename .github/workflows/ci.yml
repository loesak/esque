name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - working-directory: implementations/jvm
        run: ./gradlew -PprojectVersion=$(../../.github/version_jvm.sh) ktfmtCheck detekt build
      - working-directory: implementations/jvm
        run: ./gradlew -PprojectVersion=$(../../.github/version_jvm.sh) publish -x test
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - working-directory: implementations/python
        run: uv sync
      - working-directory: implementations/python
        run: uv run ruff check src/
      - working-directory: implementations/python
        run: uv run ruff format --check src/
      - working-directory: implementations/python
        run: uv run pyright
      - working-directory: implementations/python
        run: uv run pytest
      - working-directory: implementations/python
        run: sed -i "s/^version = .*/version = \"$(../../.github/version_python.sh)\"/" pyproject.toml
      - working-directory: implementations/python
        run: uv build
      - if: github.event_name != 'release'
        working-directory: implementations/python
        run: uv publish --publish-url https://test.pypi.org/legacy/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
      - if: github.event_name == 'release'
        working-directory: implementations/python
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - working-directory: implementations/typescript
        run: npm ci
      - working-directory: implementations/typescript
        run: npx biome ci src tests
      - working-directory: implementations/typescript
        run: npm run typecheck
      - working-directory: implementations/typescript
        run: npm test
      - working-directory: implementations/typescript
        run: npm version --no-git-tag-version "$(../../.github/version_typescript.sh)"
      - working-directory: implementations/typescript
        run: npm run build
      - working-directory: implementations/typescript
        run: node dist/cli.js --help
      - if: github.event_name != 'release'
        working-directory: implementations/typescript
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: github.event_name == 'release'
        working-directory: implementations/typescript
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  compatibility-tests:
    runs-on: ubuntu-latest
    needs: [jvm, python, typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --project implementations/python
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - working-directory: implementations/typescript
        run: npm ci
      - working-directory: tests
        run: uv run pytest . -v
