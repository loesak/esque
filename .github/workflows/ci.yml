name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - run: ./gradlew -PprojectVersion=$(./version.sh) ktfmtCheck detekt build

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - working-directory: implementations/python
        run: uv sync
      - working-directory: implementations/python
        run: uv run ruff check esque/
      - working-directory: implementations/python
        run: uv run ruff format --check esque/
      - working-directory: implementations/python
        run: uv run pyright esque/

  compatibility-tests:
    runs-on: ubuntu-latest
    needs: [build-jvm, build-python]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --project implementations/python
      - working-directory: tests
        run: uv run pytest . -v
